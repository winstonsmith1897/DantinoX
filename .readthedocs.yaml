# .readthedocs.yaml
# ReadTheDocs build configuration for DantinoX.
# Full reference: https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# Build with Sphinx (sphinx_rtd_theme — classic Read the Docs layout)
sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

# Install the docs dependencies and the package itself (needed by autodoc)
python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
      extra_requirements:
        - dev
